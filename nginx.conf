map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|slurp|facebookexternalhit|twitterbot|linkedinbot|discordbot|whatsapp|applebot|telegrambot|pinterest|slackbot) 1;
}

server {
    listen 80;
    # Production deploys place files under /opt/mastercrafters.in/main/
    root /opt/mastercrafters.in/main;
    index index.html;
    
    server_name test.com www.test.com;

    # Artist route handling:
    # - If User-Agent looks like a crawler, internally rewrite to the
    #   prerendered file at /artist/<slug>/index.html so bots receive metadata.
    # - Otherwise serve the SPA index so the React router boots for browsers.
    location ~ ^/artist/([^/]+)/?$ {
        # If crawler, serve the prerendered file. Use `last` so the rewritten
        # /artist/<slug>/index.html URI is handled as a static file by the
        # normal location block below.
        if ($is_bot = 1) {
            rewrite ^/artist/([^/]+)/?$ /artist/$1/index.html last;
        }

        # Do not check `$uri/` here. The build contains prerendered
        # /artist/<slug>/index.html metadata files; checking `$uri/` makes
        # nginx redirect /artist/<slug> -> /artist/<slug>/ and serve that file
        # to browsers instead of booting the React SPA.
        try_files /index.html =404;
    }

    # Default: serve static files, otherwise fallback to SPA index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
