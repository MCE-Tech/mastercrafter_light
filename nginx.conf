map $http_user_agent $is_bot {
    default 0;
    ~*(googlebot|bingbot|slurp|facebookexternalhit|twitterbot|linkedinbot|discordbot|whatsapp|applebot|telegrambot|pinterest|slackbot) 1;
}

server {
    listen 80;
    # Production deploys place files under /opt/mastercrafters.in/main/
    root /opt/mastercrafters.in/main;
    index index.html;
    
    server_name beta.mastercrafters.in www.beta.mastercrafters.in;

    # Artist route handling:
    # - If User-Agent looks like a crawler, internally rewrite to the
    #   prerendered file at /artist/<slug>/index.html so bots receive metadata.
    # - Otherwise serve the SPA index so the React router boots for browsers.
    location ~ ^/artist/([^/]+)/?$ {
        # If crawler, serve the prerendered file
        if ($is_bot = 1) {
            rewrite ^/artist/([^/]+)/?$ /artist/$1/index.html break;
        }

        try_files $uri $uri/ /index.html;
    }

    # Default: serve static files, otherwise fallback to SPA index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
