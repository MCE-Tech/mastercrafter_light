name: Deploy Main to Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      # NEW STEP: Inject the allowedHosts config into vite.config.js
      - name: Configure Vite Allowed Hosts
        run: |
          sed -i 's/defineConfig\s*({/defineConfig({ server: { allowedHosts: ["beta.mastercrafters.in", "www.beta.mastercrafters.in"] },/' vite.config.ts
          
          # DEBUG: This lets you see the result in the GitHub logs
          echo "Checking vite.config.ts content:"
          cat vite.config.ts
      - name: Build
        run: |
          npm install
          npm run build

      - name: Upload to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*"
          # TARGET A DIFFERENT FOLDER
          target: "/home/${{ secrets.EC2_USER }}/temp-main"
          strip_components: 1

      - name: Deploy to Preview Location
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Target a different directory for Main branch
            sudo mkdir -p /opt/mastercrafters.in/main/
            sudo rm -rf /opt/mastercrafters.in//main/*
            sudo mv /home/${{ secrets.EC2_USER }}/temp-main/* /opt/mastercrafters.in/main/
            sudo chown -R www-data:www-data /opt/mastercrafters.in/main/

      - name: Upload nginx config
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "nginx.conf"
          target: "/home/${{ secrets.EC2_USER }}/temp-nginx.conf"

      - name: Install nginx config and reload
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo mv /home/${{ secrets.EC2_USER }}/temp-nginx.conf /etc/nginx/sites-available/beta.mastercrafters.in
            sudo ln -sf /etc/nginx/sites-available/beta.mastercrafters.in /etc/nginx/sites-enabled/beta.mastercrafters.in
            sudo nginx -t
            sudo systemctl reload nginx
