name: Scheduled Release Deployment

on:
  schedule:
    # 10:00 PM UTC Saturday = 3:30 AM IST Sunday
    - cron: '0 22 * * 6'
  workflow_dispatch: # Important: This lets you test it MANUALLY first

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Safety: Ensure this ONLY runs if the file exists on the release branch
    if: github.ref == 'refs/heads/release'
    
    steps:
      - name: Checkout Release Branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Build Code
        run: |
          npm install
          npm run build

      - name: Upload to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/*" # Change to "build/*" if using React
          target: "/home/${{ secrets.EC2_USER }}/temp-deploy"
          strip_components: 1

      - name: Deploy on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Create target dir if it doesn't exist
            sudo mkdir -p /opt/mastercrafters.in/beta
            
            # 2. Clear old files to prevent conflicts
            sudo rm -rf /opt/mastercrafters.in/beta/*
            
            # 3. Move new build into NGINX root
            sudo mv /home/${{ secrets.EC2_USER }}/temp-deploy/* /opt/mastercrafters.in/beta/
            
            # 4. Fix permissions so NGINX can read the files
            sudo chown -R www-data:www-data /opt/mastercrafters.in/beta
            
            # 5. Refresh NGINX
            sudo systemctl reload nginx